<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>測試三分化模板</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .day { border: 1px solid #ccc; margin: 10px 0; padding: 10px; }
        .exercise { background: #f0f0f0; margin: 5px 0; padding: 5px; }
        button { padding: 10px 20px; margin: 10px; }
    </style>
</head>
<body>
    <h1>測試三分化模板</h1>
    <button onclick="testTemplate()">測試三分化模板</button>
    <button onclick="checkDatabase()">檢查資料庫</button>
    <div id="result"></div>

    <script>
        let exercises = [];
        let usedExercises = new Set();

        // 載入動作資料
        async function loadExercises() {
            try {
                const response = await fetch('get_exercises.php');
                const data = await response.json();
                
                if (data.success && data.data) {
                    exercises = data.data;
                    console.log('載入動作資料成功，總數:', exercises.length);
                } else {
                    console.error('載入動作資料失敗');
                }
            } catch (error) {
                console.error('載入動作時發生錯誤:', error);
            }
        }

        // 檢查資料庫
        async function checkDatabase() {
            try {
                const response = await fetch('debug_exercises.php');
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('result').innerHTML = `
                        <h3>資料庫統計</h3>
                        <p>總動作數: ${data.total_exercises}</p>
                        <h4>肌群分佈:</h4>
                        <ul>
                            ${data.muscle_groups.map(mg => `<li>${mg.muscle_group}: ${mg.count}個動作</li>`).join('')}
                        </ul>
                        <h4>特定肌群動作:</h4>
                        ${Object.entries(data.specific_exercises).map(([muscle, exs]) => 
                            `<h5>${muscle} (${exs.length}個):</h5><ul>${exs.map(ex => `<li>${ex.name} (${ex.difficulty_level})</li>`).join('')}</ul>`
                        ).join('')}
                    `;
                } else {
                    document.getElementById('result').innerHTML = `<p>錯誤: ${data.error}</p>`;
                }
            } catch (error) {
                document.getElementById('result').innerHTML = `<p>錯誤: ${error.message}</p>`;
            }
        }

        // 獲取隨機動作
        function getRandomExercise(muscleGroup) {
            console.log(`尋找 ${muscleGroup} 動作，總動作數: ${exercises.length}`);
            
            if (!exercises || exercises.length === 0) {
                console.error('動作資料未載入！');
                return null;
            }
            
            // 先嘗試直接匹配
            let availableExercises = exercises.filter(ex => ex.muscle_group === muscleGroup);
            console.log(`直接匹配找到 ${availableExercises.length} 個動作`);

            // 如果沒有找到對應肌群的動作，嘗試映射到相近的肌群
            if (availableExercises.length === 0) {
                const muscleMapping = {
                    '上胸': '上胸',
                    '中胸': '中胸',
                    '下胸': '下胸',
                    '上背': '上背',
                    '中背': '中背',
                    '下背': '下背',
                    '肩膀前束': '肩膀前束',
                    '肩膀中束': '肩膀中束',
                    '肩膀後束': '肩膀後束',
                    '三頭肌': '三頭肌',
                    '二頭肌': '二頭肌',
                    '股四頭肌': '股四頭肌',
                    '股二頭肌': '股二頭肌',
                    '臀肌': '臀肌',
                    '上腹': '上腹',
                    '下腹': '下腹',
                    '側腹': '側腹'
                };

                const mappedMuscle = muscleMapping[muscleGroup] || muscleGroup;
                console.log(`映射 ${muscleGroup} 到 ${mappedMuscle}`);
                availableExercises = exercises.filter(ex => ex.muscle_group === mappedMuscle);
                console.log(`映射後找到 ${availableExercises.length} 個動作`);
            }

            if (availableExercises.length === 0) {
                console.log(`資料庫中沒有找到 ${muscleGroup} 的動作`);
                return null;
            }

            // 過濾掉已經使用過的動作
            const unusedExercises = availableExercises.filter(ex => !usedExercises.has(ex.id));
            console.log(`過濾已使用動作後剩餘 ${unusedExercises.length} 個動作`);

            if (unusedExercises.length === 0) {
                console.log('所有動作都已使用，重置已使用列表');
                usedExercises.clear();
                availableExercises = availableExercises;
            } else {
                availableExercises = unusedExercises;
            }

            if (availableExercises.length === 0) {
                console.log(`最終沒有找到任何 ${muscleGroup} 動作`);
                return null;
            }
            
            const selectedExercise = availableExercises[Math.floor(Math.random() * availableExercises.length)];
            usedExercises.add(selectedExercise.id);
            
            console.log(`選擇了動作: ${selectedExercise.name} (${selectedExercise.muscle_group})`);
            return selectedExercise;
        }

        // 測試三分化模板
        async function testTemplate() {
            await loadExercises();
            
            const template = {
                name: '三分化',
                exercises: {
                    monday: [
                        { muscleGroup: '上胸', count: 1, sets: 4, reps: 8 },
                        { muscleGroup: '中胸', count: 1, sets: 4, reps: 8 },
                        { muscleGroup: '下胸', count: 1, sets: 4, reps: 8 },
                        { muscleGroup: '三頭肌', count: 2, sets: 4, reps: 10 }
                    ],
                    tuesday: [
                        { muscleGroup: '上背', count: 1, sets: 4, reps: 8 },
                        { muscleGroup: '中背', count: 1, sets: 4, reps: 8 },
                        { muscleGroup: '下背', count: 1, sets: 4, reps: 8 },
                        { muscleGroup: '二頭肌', count: 2, sets: 4, reps: 10 }
                    ],
                    wednesday: [
                        { muscleGroup: '肩膀前束', count: 1, sets: 4, reps: 10 },
                        { muscleGroup: '肩膀中束', count: 1, sets: 4, reps: 10 },
                        { muscleGroup: '肩膀後束', count: 1, sets: 4, reps: 10 },
                        { muscleGroup: '股四頭肌', count: 1, sets: 4, reps: 8 },
                        { muscleGroup: '股二頭肌', count: 1, sets: 4, reps: 8 },
                        { muscleGroup: '臀肌', count: 1, sets: 4, reps: 8 }
                    ],
                    friday: [
                        { muscleGroup: '上胸', count: 1, sets: 4, reps: 8 },
                        { muscleGroup: '中胸', count: 1, sets: 4, reps: 8 },
                        { muscleGroup: '下胸', count: 1, sets: 4, reps: 8 },
                        { muscleGroup: '三頭肌', count: 2, sets: 4, reps: 10 }
                    ],
                    saturday: [
                        { muscleGroup: '上背', count: 1, sets: 4, reps: 8 },
                        { muscleGroup: '中背', count: 1, sets: 4, reps: 8 },
                        { muscleGroup: '下背', count: 1, sets: 4, reps: 8 },
                        { muscleGroup: '二頭肌', count: 2, sets: 4, reps: 10 }
                    ],
                    sunday: [
                        { muscleGroup: '肩膀前束', count: 1, sets: 4, reps: 10 },
                        { muscleGroup: '肩膀中束', count: 1, sets: 4, reps: 10 },
                        { muscleGroup: '肩膀後束', count: 1, sets: 4, reps: 10 },
                        { muscleGroup: '股四頭肌', count: 1, sets: 4, reps: 8 },
                        { muscleGroup: '股二頭肌', count: 1, sets: 4, reps: 8 },
                        { muscleGroup: '臀肌', count: 1, sets: 4, reps: 8 }
                    ]
                }
            };

            usedExercises.clear();
            let result = '<h3>三分化模板測試結果</h3>';

            Object.keys(template.exercises).forEach(day => {
                result += `<div class="day"><h4>${day}</h4>`;
                const dayExercises = template.exercises[day];
                
                dayExercises.forEach(exerciseGroup => {
                    result += `<h5>${exerciseGroup.muscleGroup} (需要 ${exerciseGroup.count} 個動作):</h5>`;
                    
                    for (let i = 0; i < exerciseGroup.count; i++) {
                        const exercise = getRandomExercise(exerciseGroup.muscleGroup);
                        if (exercise) {
                            result += `<div class="exercise">${exercise.name} (${exercise.muscle_group}) - ${exerciseGroup.sets}組 × ${exerciseGroup.reps}次</div>`;
                        } else {
                            result += `<div class="exercise" style="color: red;">找不到 ${exerciseGroup.muscleGroup} 動作</div>`;
                        }
                    }
                });
                
                result += '</div>';
            });

            document.getElementById('result').innerHTML = result;
        }

        // 頁面載入時載入動作資料
        window.onload = loadExercises;
    </script>
</body>
</html>

    <script>
        async function loadHistory() {
            try {
                const response = await fetch("get_history.php", {
                    credentials: "include"
                });

                const text = await response.text();
                console.log("伺服器回傳:", text);

                let result;
                try {
                    result = JSON.parse(text);
                } catch (e) {
                    document.getElementById("history-list").innerHTML =
                        `<div class="alert alert-danger" role="alert">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>
                            伺服器回傳的不是 JSON，請檢查 console log
                        </div>`;
                    return;
                }

                if (!result.success) {
                    document.getElementById("history-list").innerHTML =
                        `<div class="alert alert-danger" role="alert">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>
                            ${result.error || '載入資料時發生錯誤'}
                        </div>`;
                    return;
                }

                updateStats(result.stats, result.data);
                renderData(result.data);

            } catch (err) {
                console.error("❌ 載入失敗:", err);
                document.getElementById("history-list").innerHTML =
                    `<div class="alert alert-danger" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        載入紀錄時發生錯誤: ${err.message}
                    </div>`;
            }
        }

        function updateStats(stats, data = []) {
            const statsContainer = document.getElementById("stats-container");
            if (!statsContainer) return;

            // 1️⃣ 總數
            const total = (stats && typeof stats.total_records === 'number')
                ? stats.total_records
                : (Array.isArray(data) ? data.length : 0);

            // 2️⃣ 本月新增紀錄數
            let monthlyCount = 0;
            if (Array.isArray(data) && data.length) {
                const now = new Date();
                const currentYear = now.getFullYear();
                const currentMonth = now.getMonth(); // 0 ~ 11

                monthlyCount = data.filter(r => {
                    if (!r?.Date) return false;
                    const d = new Date(r.Date);
                    return d.getFullYear() === currentYear && d.getMonth() === currentMonth;
                }).length;
            }

            // 3️⃣ 平均 BMI
            let avgBMI = '-';
            if (Array.isArray(data) && data.length) {
                const bmis = data
                    .map(r => parseFloat(r?.bmi))
                    .filter(v => Number.isFinite(v));
                if (bmis.length) {
                    avgBMI = (bmis.reduce((a, b) => a + b, 0) / bmis.length).toFixed(2);
                }
            }

            // 4️⃣ 三小卡佈局
            statsContainer.innerHTML = `
    <div class="row mb-4 text-center">
      <div class="col-md-4 mb-3 mb-md-0">
        <div class="card bg-primary text-white shadow-sm h-100">
          <div class="card-body d-flex flex-column justify-content-center">
            <h4 class="mb-1">${total}</h4>
            <p class="mb-0">健康記錄總數</p>
          </div>
        </div>
      </div>
      <div class="col-md-4 mb-3 mb-md-0">
        <div class="card bg-success text-white shadow-sm h-100">
          <div class="card-body d-flex flex-column justify-content-center">
            <h4 class="mb-1">${monthlyCount}</h4>
            <p class="mb-0">本月新增紀錄數</p>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card bg-info text-white shadow-sm h-100">
          <div class="card-body d-flex flex-column justify-content-center">
            <h4 class="mb-1">${avgBMI}</h4>
            <p class="mb-0">平均 BMI</p>
          </div>
        </div>
      </div>
    </div>
  `;
        }

        /** 取得欄位：同時支援底線與連字號 **/
        const getField = (obj, underScoreKey, hyphenKey) =>
            obj?.[underScoreKey] ?? obj?.[hyphenKey] ?? '';

        /** 安全取得 record_id（避免 undefined 時 substring 報錯） **/
        const getId = (r) => r?.record_id || r?.id || '';

        /* render 時：把顯示欄位改成同時支援 */
        function renderData(data) {
            const container = document.getElementById("history-list");
            container.innerHTML = "";

            if (!Array.isArray(data) || data.length === 0) {
                container.innerHTML = `
      <div class="col-12">
        <div class="alert alert-morandi text-center" role="alert">
          <i class="bi bi-info-circle-fill me-2"></i>
          目前沒有歷史紀錄，請先新增健康數據
        </div>
      </div>`;
                return;
            }

            data.forEach((record, index) => {
                const recordId = getId(record);
                const age = getField(record, 'age', 'age');
                const h = getField(record, 'height_cm', 'height-cm');
                const w = getField(record, 'weight_kg', 'weight-kg');
                const sm = getField(record, 'skeletal_muscle', 'skeletal_muscle');
                const bfkg = getField(record, 'body_fat', 'body_fat');
                const bfper = getField(record, 'fat_percentage', 'fat_percentage');
                const bmr = getField(record, 'basal_metabolism', 'basal_metabolism');
                const bmi = getField(record, 'bmi', 'bmi');

                const card = document.createElement("div");
                card.className = "col-12 col-md-6 col-lg-4 mb-4";
                card.innerHTML = `
      <div class="card shadow-lg border-0 rounded-4 h-100">
        <div class="card-header bg-gradient-primary text-white">
          <h5 class="card-title mb-1">
            📅 ${record.Date || ''} <small class="opacity-75">#${index + 1}</small>
          </h5>
        </div>
        <div class="card-body">
          <div class="row mb-3">
            <div class="col-4 text-center">
              <div class="border-end">
                <strong class="d-block text-primary">年齡</strong>
                <span class="text-muted">${age}</span>
              </div>
            </div>
            <div class="col-4 text-center">
              <div class="border-end">
                <strong class="d-block text-primary">身高</strong>
                <span class="text-muted">${h} cm</span>
              </div>
            </div>
            <div class="col-4 text-center">
              <strong class="d-block text-primary">體重</strong>
              <span class="text-muted">${w} kg</span>
            </div>
          </div>

          <div class="row mb-3">
            <div class="col-4 text-center">
              <div class="border-end">
                <strong class="d-block text-success">骨骼肌</strong>
                <span class="text-muted">${sm} kg</span>
              </div>
            </div>
            <div class="col-4 text-center">
              <div class="border-end">
                <strong class="d-block text-warning">體脂重</strong>
                <span class="text-muted">${bfkg} kg</span>
              </div>
            </div>
            <div class="col-4 text-center">
              <strong class="d-block text-info">體脂率</strong>
              <span class="text-muted">${bfper}%</span>
            </div>
          </div>

          <div class="row">
            <div class="col-6 text-center">
              <div class="border-end">
                <strong class="d-block text-danger">基礎代謝</strong>
                <span class="text-muted">${bmr} kcal</span>
              </div>
            </div>
            <div class="col-6 text-center">
              <strong class="d-block text-secondary">BMI</strong>
              <span class="text-muted">${bmi}</span>
            </div>
          </div>
        </div>
        <div class="card-footer bg-light d-flex justify-content-between align-items-center">
          <small class="text-muted">
            <i class="bi bi-clock me-1"></i>
            記錄 ID: ${recordId ? (recordId.substring(0, 8) + '...') : '（無）'}
          </small>
          <div>
            <button class="btn btn-sm btn-detail me-2" onclick='openEditModal(${JSON.stringify(record)})'>
              <i class="bi bi-pencil-square me-1"></i> 編輯
            </button>
            <button class="btn btn-sm btn-remove" onclick="deleteRecord('${recordId}')">
              <i class="bi bi-trash me-1"></i> 刪除
            </button>
          </div>
        </div>
      </div>`;
                container.appendChild(card);
            });
        }

        /* 刪除：改用 x-www-form-urlencoded（PHP 可直接 $_POST['record_id']） */
        async function deleteRecord(recordId) {
            if (!recordId) return alert('缺少 record_id，無法刪除');
            if (!confirm('刪除此筆紀錄將無法復原，確定要刪除嗎？')) return;

            try {
                const res = await fetch('delete_record.php', {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
                    body: new URLSearchParams({ record_id: recordId }).toString()
                });
                const text = await res.text();
                let result;
                try { result = JSON.parse(text); } catch { throw new Error('後端未回傳 JSON：' + text); }
                if (result.success) {
                    await loadHistory();
                } else {
                    alert('刪除失敗：' + (result.error || '未知錯誤'));
                }
            } catch (err) {
                console.error(err);
                alert('刪除發生錯誤：' + err.message);
            }
        }


        // 只保留數字/小數點/負號；移除逗號與單位
        function toNumberString(v) {
            if (v === null || v === undefined) return '';
            return String(v).replace(/,/g, '').replace(/[^\d.-]/g, '');
        }

        // 全域變數：Bootstrap modal instance
        let editModalInstance = null;

        function openEditModal(record) {
            if (typeof record === 'string') { try { record = JSON.parse(record); } catch (e) { } }
            document.getElementById('edit_record_id').value = record.record_id || record.id || '';
            document.getElementById('edit_Date').value = record.Date ? String(record.Date).split(' ')[0].replace(/\//g, '-') : '';

            const get = (u, h) => toNumberString(getField(record, u, h));
            document.getElementById('edit_age').value = get('age', 'age');
            document.getElementById('edit_height_cm').value = get('height_cm', 'height-cm');
            document.getElementById('edit_weight_kg').value = get('weight_kg', 'weight-kg');
            document.getElementById('edit_skeletal_muscle').value = get('skeletal_muscle', 'skeletal_muscle');
            document.getElementById('edit_body_fat').value = get('body_fat', 'body_fat');
            document.getElementById('edit_fat_percentage').value = get('fat_percentage', 'fat_percentage');
            document.getElementById('edit_basal_metabolism').value = get('basal_metabolism', 'basal_metabolism');
            document.getElementById('edit_bmi').value = get('bmi', 'bmi');

            const el = document.getElementById('editRecordModal');
            if (!window.editModalInstance) window.editModalInstance = new bootstrap.Modal(el, { keyboard: true });
            window.editModalInstance.show();
        }
    </script>

                            <div class="col-md-4">
                                <label class="form-label">BMI</label>
                                <input type="number" id="edit_bmi" step="0.01" class="form-control" />
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="saveEditBtn">儲存變更</button>
                </div>
            </div>
        </div>
    </div>
    <!-- 若專案沒有打包 bootstrap.bundle，先用 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 先把「儲存」的處理邏輯抽成函式
        async function handleSaveEdit() {
            const id = document.getElementById('edit_record_id').value;
            const date = document.getElementById('edit_Date').value;

            const underScorePayload = {
                record_id: id,
                Date: date,
                age: document.getElementById('edit_age').value,
                height_cm: document.getElementById('edit_height_cm').value,
                weight_kg: document.getElementById('edit_weight_kg').value,
                skeletal_muscle: document.getElementById('edit_skeletal_muscle').value,
                body_fat: document.getElementById('edit_body_fat').value,
                fat_percentage: document.getElementById('edit_fat_percentage').value,
                basal_metabolism: document.getElementById('edit_basal_metabolism').value,
                bmi: document.getElementById('edit_bmi').value
            };
            // 放在 handleSaveEdit() 裡 ↓↓↓
            const aliasPayload = {
                id: underScorePayload.record_id, // 後端若收 id 也能過
                date: underScorePayload.Date     // 後端若收小寫 date 也能過
            };

            // 若你暫時讓後端同時支援底線/連字號，這裡也可同送；不需要就拿掉 hyphenPayload
            const hyphenPayload = {
                'height-cm': underScorePayload.height_cm,
                'weight-kg': underScorePayload.weight_kg
            };

            const params = new URLSearchParams({
                ...underScorePayload,
                ...aliasPayload,
                ...hyphenPayload
            });

            try {
                const res = await fetch('update_record.php', {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
                    body: params.toString()
                });
                const text = await res.text();
                let result;
                try { result = JSON.parse(text); } catch { throw new Error('後端未回傳 JSON：' + text); }

                if (result.success) {
                    window.editModalInstance?.hide();
                    await loadHistory();
                } else {
                    alert('更新失敗：' + (result.error || '未知錯誤'));
                }
            } catch (err) {
                console.error(err);
                alert('更新發生錯誤：' + err.message);
            }
        }

        // ✅ 等整個 DOM 都好了再做這兩件事：1) 呼叫 loadHistory；2) 綁定儲存按鈕
        document.addEventListener('DOMContentLoaded', () => {
            // 1) 真的把資料載進來，產生每張卡片上的「編輯/刪除」按鈕
            loadHistory();

            // 2) 這時候按鈕已在 DOM，才能穩定綁定事件
            const saveBtn = document.getElementById('saveEditBtn');
            if (saveBtn && !saveBtn.dataset.bound) {
                saveBtn.dataset.bound = '1';
                saveBtn.addEventListener('click', handleSaveEdit);
            }
        });
    </script>
</body>

</html>

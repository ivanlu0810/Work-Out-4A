    <script>
        // 自定義確認對話框函數
        function showConfirmDialog(message, title = '確認') {
            return new Promise((resolve) => {
                const modalHtml = `
                    <div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
                        <div class="modal-dialog">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h5 class="modal-title">${title}</h5>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                </div>
                                <div class="modal-body">
                                    <p>${message}</p>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" id="confirmCancel">取消</button>
                                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal" id="confirmOk">確定</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                
                // 移除舊的模態框
                const existingModal = document.getElementById('confirmModal');
                if (existingModal) {
                    existingModal.remove();
                }
                
                // 添加新的模態框到 body
                document.body.insertAdjacentHTML('beforeend', modalHtml);
                
                // 顯示模態框
                const modal = new bootstrap.Modal(document.getElementById('confirmModal'));
                modal.show();
                
                // 綁定按鈕事件
                document.getElementById('confirmOk').addEventListener('click', () => {
                    modal.hide();
                    resolve(true);
                });
                
                document.getElementById('confirmCancel').addEventListener('click', () => {
                    modal.hide();
                    resolve(false);
                });
                
                // 模態框關閉後移除元素
                document.getElementById('confirmModal').addEventListener('hidden.bs.modal', function() {
                    this.remove();
                    resolve(false);
                });
            });
        }

        // 自定義提示框函數 - 與 profile.html 完全一致
        function showCustomAlert(message, title = '提示！') {
            // 創建模態框 HTML（與 profile.html 的 successModal 結構一致）

                <div class="modal fade" id="customAlertModal" tabindex="-1" aria-hidden="true">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title">${title}</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                            </div>
                            <div class="modal-body">
                                <p>${message}</p>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-primary" data-bs-dismiss="modal">確定</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            // 移除舊的模態框
            const existingModal = document.getElementById('customAlertModal');
            if (existingModal) {
                existingModal.remove();
            }
            
            // 添加新的模態框到 body
            document.body.insertAdjacentHTML('beforeend', modalHtml);
            
            // 顯示模態框
            const modal = new bootstrap.Modal(document.getElementById('customAlertModal'));
            modal.show();
            
            // 模態框關閉後移除元素
            document.getElementById('customAlertModal').addEventListener('hidden.bs.modal', function() {

        async function loadHistory() {
            try {
                const response = await fetch("get_history.php", {
                    credentials: "include"
                });

                const text = await response.text();
                console.log("伺服器回傳:", text);

                let result;
                try {
                    result = JSON.parse(text);
                } catch (e) {
                    // 與成功提示一致：改用模態框
                    showCustomAlert('伺服器回傳的不是 JSON，請檢查 console log');
                    document.getElementById("history-list").innerHTML = '';
                    return;
                }

                if (!result.success) {
                    // 與成功提示一致：改用模態框
                    showCustomAlert(`${result.error || '載入資料時發生錯誤'}`);
                    document.getElementById("history-list").innerHTML = '';
                    return;
                }

                // 儲存原始資料於全域，供前端篩選使用
                window.historyDataOriginal = Array.isArray(result.data) ? result.data : [];
                // 初次渲染：依目前篩選條件（預設顯示全部）
                applyDateFilter({ preferServerStats: result.stats });

            } catch (err) {
                console.error("❌ 載入失敗:", err);
                // 與成功提示一致：改用模態框
                showCustomAlert(`載入紀錄時發生錯誤: ${err.message}`);
                document.getElementById("history-list").innerHTML = '';
            }
        }

        function updateStats(stats, data = []) {
            const statsContainer = document.getElementById("stats-container");
            if (!statsContainer) return;

            // 1️⃣ 總數
            const total = (stats && typeof stats.total_records === 'number')
                ? stats.total_records
                : (Array.isArray(data) ? data.length : 0);

            // 2️⃣ 本月新增紀錄數
            let monthlyCount = 0;
            if (Array.isArray(data) && data.length) {
                const now = new Date();
                const currentYear = now.getFullYear();
                const currentMonth = now.getMonth(); // 0 ~ 11

                monthlyCount = data.filter(r => {
                    if (!r?.Date) return false;
                    const d = new Date(r.Date);
                    return d.getFullYear() === currentYear && d.getMonth() === currentMonth;
                }).length;
            }

            // 3️⃣ 平均 BMI
            let avgBMI = '-';
            if (Array.isArray(data) && data.length) {
                const bmis = data
                    .map(r => parseFloat(r?.bmi))
                    .filter(v => Number.isFinite(v));
                if (bmis.length) {
                    avgBMI = (bmis.reduce((a, b) => a + b, 0) / bmis.length).toFixed(2);
                }
            }

            // 4️⃣ 三小卡佈局
            statsContainer.innerHTML = `
    <div class="row mb-4 text-center">
      <div class="col-md-4 mb-3 mb-md-0">
        <div class="card bg-primary text-white shadow-sm h-100">
          <div class="card-body d-flex flex-column justify-content-center">
            <h4 class="mb-1">${total}</h4>
            <p class="mb-0">健康記錄總數</p>
          </div>
        </div>
      </div>
      <div class="col-md-4 mb-3 mb-md-0">
        <div class="card bg-success text-white shadow-sm h-100">
          <div class="card-body d-flex flex-column justify-content-center">
            <h4 class="mb-1">${monthlyCount}</h4>

          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card bg-info text-white shadow-sm h-100">
          <div class="card-body d-flex flex-column justify-content-center">
            <h4 class="mb-1">${avgBMI}</h4>
            <p class="mb-0">平均 BMI</p>
          </div>
        </div>
      </div>
    </div>
  `;
        }

        /** 取得欄位：同時支援底線與連字號 **/
        const getField = (obj, underScoreKey, hyphenKey) =>
            obj?.[underScoreKey] ?? obj?.[hyphenKey] ?? '';

        /** 安全取得 record_id（避免 undefined 時 substring 報錯） **/
        const getId = (r) => r?.record_id || r?.id || '';

        // 全域變數：分頁相關
        let currentPage = 1;
        const recordsPerPage = 3;

        // 分頁函數
        function paginateData(data, page = 1) {
            const startIndex = (page - 1) * recordsPerPage;
            const endIndex = startIndex + recordsPerPage;
            return data.slice(startIndex, endIndex);
        }

        // 渲染分頁控制 - 水平排列
        function renderPagination(totalRecords, currentPageNum) {
            const totalPages = Math.ceil(totalRecords / recordsPerPage);
            const paginationContainer = document.getElementById("pagination-container");
            const paginationControls = document.getElementById("pagination-controls");

            if (totalPages <= 1) {
                paginationContainer.style.display = "none";
                return;
            }

            paginationContainer.style.display = "flex";
            paginationControls.innerHTML = "";

            // 上一頁按鈕
            const prevButton = document.createElement("button");
            prevButton.innerHTML = '<';
            prevButton.disabled = currentPageNum === 1;
            prevButton.onclick = () => goToPage(currentPageNum - 1);
            paginationControls.appendChild(prevButton);

            // 頁碼按鈕
            const startPage = Math.max(1, currentPageNum - 2);
            const endPage = Math.min(totalPages, currentPageNum + 2);

            if (startPage > 1) {
                const firstPageBtn = createPageButton(1);
                paginationControls.appendChild(firstPageBtn);
                if (startPage > 2) {
                    const ellipsis = document.createElement("span");
                    ellipsis.textContent = '...';
                    ellipsis.style.padding = '0 5px';
                    ellipsis.style.display = 'flex';
                    ellipsis.style.alignItems = 'center';
                    ellipsis.style.justifyContent = 'center';
                    ellipsis.style.minWidth = '35px';
                    ellipsis.style.height = '35px';
                    paginationControls.appendChild(ellipsis);
                }
            }

            for (let i = startPage; i <= endPage; i++) {
                const pageBtn = createPageButton(i);
                paginationControls.appendChild(pageBtn);
            }

            if (endPage < totalPages) {
                if (endPage < totalPages - 1) {
                    const ellipsis = document.createElement("span");
                    ellipsis.textContent = '...';
                    ellipsis.style.padding = '0 5px';
                    ellipsis.style.display = 'flex';
                    ellipsis.style.alignItems = 'center';
                    ellipsis.style.justifyContent = 'center';
                    ellipsis.style.minWidth = '35px';
                    ellipsis.style.height = '35px';
                    paginationControls.appendChild(ellipsis);
                }
                const lastPageBtn = createPageButton(totalPages);
                paginationControls.appendChild(lastPageBtn);
            }

            // 下一頁按鈕
            const nextButton = document.createElement("button");
            nextButton.innerHTML = '>';
            nextButton.disabled = currentPageNum === totalPages;
            nextButton.onclick = () => goToPage(currentPageNum + 1);
            paginationControls.appendChild(nextButton);

            // 頁碼資訊
            const pageInfo = document.createElement("span");
            pageInfo.className = "pagination-info";
            pageInfo.textContent = `第 ${currentPageNum} 頁，共 ${totalPages} 頁 (共 ${totalRecords} 項)`;
            paginationControls.appendChild(pageInfo);
        }

        // 建立頁碼按鈕 - 與 training.html 一致
        function createPageButton(pageNumber) {
            const button = document.createElement("button");
            button.textContent = pageNumber;
            button.className = currentPage === pageNumber ? 'active' : '';
            button.onclick = () => goToPage(pageNumber);
            return button;
        }

        // 跳轉到指定頁碼
        function goToPage(pageNumber) {
            const totalPages = Math.ceil((window.historyDataFiltered || []).length / recordsPerPage);
            if (pageNumber < 1 || pageNumber > totalPages) return;

            currentPage = pageNumber;
            applyDateFilter({ onlyOnApply: false, resetPage: false });
        }

        /* render 時：把顯示欄位改成同時支援 */
        function renderData(data, page = 1) {
            const container = document.getElementById("history-list");

            if (!Array.isArray(data) || data.length === 0) {

        </div>
      </div>`;
                // 隱藏分頁控制
                document.getElementById("pagination-container").style.display = "none";
                return;

            // 分頁處理
            const paginatedData = paginateData(data, page);

            paginatedData.forEach((record, index) => {

                const bfper = getField(record, 'fat_percentage', 'fat_percentage');
                const bmr = getField(record, 'basal_metabolism', 'basal_metabolism');
                const bmi = getField(record, 'bmi', 'bmi');

                const card = document.createElement("div");
                card.className = "col-12 col-md-6 col-lg-4 mb-4";
                card.innerHTML = `
      <div class="card shadow-lg border-0 rounded-4 h-100">
        <div class="card-header bg-gradient-primary text-white">
          <h5 class="card-title mb-1">
            📅 ${record.Date || ''} <small class="opacity-75">#${globalIndex + 1}</small>
          </h5>
        </div>
        <div class="card-body">
          <div class="row mb-3">
            <div class="col-4 text-center">
              <div class="border-end">
                <strong class="d-block text-primary">年齡</strong>
                <span class="text-muted">${age}</span>

          <div class="row mb-3">

            </button>

                container.appendChild(card);

        /* 刪除：改用 x-www-form-urlencoded（PHP 可直接 $_POST['record_id']） */
        async function deleteRecord(recordId) {
            if (!recordId) return showCustomAlert('缺少 record_id，無法刪除', '錯誤');
            
            // 使用自定義確認對話框
            const confirmed = await showConfirmDialog('刪除此筆紀錄將無法復原，確定要刪除嗎？', '提示！');
            if (!confirmed) return;

            try {
                const btns = document.querySelectorAll('.btn-remove');
                btns.forEach(b=>b.disabled=true);
                const res = await fetch('delete_record.php', {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
                    body: new URLSearchParams({ record_id: recordId }).toString()
                });
                const text = await res.text();
                let result;
                try { result = JSON.parse(text); } catch { throw new Error('後端未回傳 JSON：' + text); }
                if (result.success) {
                    showCustomAlert('刪除成功');
                    await loadHistory();
                } else {
                    showCustomAlert('刪除失敗：' + (result.error || '未知錯誤'), '錯誤');
                }
            } catch (err) {
                console.error(err);
                showCustomAlert('刪除發生錯誤：' + err.message, '錯誤');
            } finally {
                const btns = document.querySelectorAll('.btn-remove');
                btns.forEach(b=>b.disabled=false);
            }
        }


        // 只保留數字/小數點/負號；移除逗號與單位
        function toNumberString(v) {
            if (v === null || v === undefined) return '';
            // 確保返回的是可編輯的字串
            return String(v).replace(/,/g, '').replace(/[^\d.-]/g, '');
        }

        // 將各種日期格式安全轉為 YYYY-MM-DD 字串（若無法解析則回傳空字串）
        function toDateOnlyString(input) {
            if (!input) return '';
            const s = String(input).replace(/\//g, '-');
            // 若已是 YYYY-MM-DD 開頭，先取前 10 碼
            const first10 = s.slice(0, 10);
            // 嘗試用 Date 解析
            const d = new Date(first10);
            if (isNaN(d.getTime())) {
                // 再嘗試完整字串
                const d2 = new Date(s);
                if (isNaN(d2.getTime())) return '';
                const yyyy = d2.getFullYear();
                const mm = String(d2.getMonth() + 1).padStart(2, '0');
                const dd = String(d2.getDate()).padStart(2, '0');
                return `${yyyy}-${mm}-${dd}`;
            }
            const yyyy = d.getFullYear();
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        }

        // 日期篩選主函式
        function applyDateFilter(options = {}) {
            const startEl = document.getElementById('filter_start');
            const endEl = document.getElementById('filter_end');
            const start = startEl?.value || '';
            const end = endEl?.value || '';

            const src = Array.isArray(window.historyDataOriginal) ? window.historyDataOriginal : [];

            // 僅在指定（onlyOnApply）且兩者皆有值時才過濾
            let filtered = src;
            const shouldFilter = options.onlyOnApply ? (start && end) : (start || end);
            if (shouldFilter) {
                filtered = src.filter(r => {
                    const dStr = toDateOnlyString(r?.Date);
                    if (!dStr) return false;
                    if (start && dStr < start) return false;
                    if (end && dStr > end) return false;
                    return true;
                });
            }

            // 重置到第一頁（當篩選條件改變時）
            if (options.resetPage !== false) {
                currentPage = 1;
            }

            // 優先用目前篩選後的資料更新統計與列表
            updateStats(options.preferServerStats, filtered);
            renderData(filtered, currentPage);

            // 暫存目前的過濾結果
            window.historyDataFiltered = filtered;
        }

        // 全域變數：Bootstrap modal instance
        let editModalInstance = null;

        function openEditModal(record) {
            if (typeof record === 'string') { try { record = JSON.parse(record); } catch (e) { } }
            
            // 清除所有輸入欄位的值
            document.getElementById('edit_record_id').value = record.record_id || record.id || '';
            document.getElementById('edit_Date').value = record.Date ? String(record.Date).split(' ')[0].replace(/\//g, '-') : '';

            // 安全地設定數值欄位
            const setValue = (id, value) => {
                const element = document.getElementById(id);
                if (element) {
                    element.value = value || '';
                    element.disabled = false; // 確保欄位未被禁用
                    element.readOnly = false; // 確保欄位可讀寫
                    console.log(`設定 ${id}: ${value}, disabled: ${element.disabled}, readOnly: ${element.readOnly}`);
                } else {
                    console.error(`找不到元素: ${id}`);
                }
            };

            setValue('edit_age', record.age || '');
            setValue('edit_height_cm', record['height-cm'] || record.height_cm || '');
            setValue('edit_weight_kg', record['weight-kg'] || record.weight_kg || '');
            setValue('edit_skeletal_muscle', record.skeletal_muscle || '');
            setValue('edit_body_fat', record.body_fat || '');
            setValue('edit_fat_percentage', record.fat_percentage || '');
            setValue('edit_basal_metabolism', record.basal_metabolism || '');
            setValue('edit_bmi', record.bmi || '');

            // 動態綁定：身高/體重變更自動計算 BMI
            const heightEl = document.getElementById('edit_height_cm');
            const weightEl = document.getElementById('edit_weight_kg');
            const bmiEl = document.getElementById('edit_bmi');
            
            const recomputeBMI = () => {
                const h = parseFloat(heightEl.value);
                const w = parseFloat(weightEl.value);
                if (Number.isFinite(h) && h > 0 && Number.isFinite(w)) {
                    const m = h / 100;
                    bmiEl.value = (w / (m * m)).toFixed(2);
                }
            };
            
            // 移除舊的事件監聽器，避免重複綁定
            heightEl.removeEventListener('input', recomputeBMI);
            weightEl.removeEventListener('input', recomputeBMI);
            
            // 重新綁定事件
            heightEl.addEventListener('input', recomputeBMI);
            weightEl.addEventListener('input', recomputeBMI);

            const el = document.getElementById('editRecordModal');
            if (!window.editModalInstance) window.editModalInstance = new bootstrap.Modal(el, { keyboard: true });
            window.editModalInstance.show();
        }
    </script>

    <script>
        // 先把「儲存」的處理邏輯抽成函式
        async function handleSaveEdit() {
            const id = document.getElementById('edit_record_id').value;
            const date = document.getElementById('edit_Date').value;

            // 基本驗證
            const height = parseFloat(document.getElementById('edit_height_cm').value);
            const weight = parseFloat(document.getElementById('edit_weight_kg').value);
            if (!date) return showCustomAlert('請選擇日期', '錯誤');
            if (!Number.isFinite(height) || height <= 0) return showCustomAlert('請填入有效身高', '錯誤');
            if (!Number.isFinite(weight) || weight <= 0) return showCustomAlert('請填入有效體重', '錯誤');

            const underScorePayload = {
                record_id: id,
                Date: date,
                age: document.getElementById('edit_age').value,
                height_cm: document.getElementById('edit_height_cm').value,
                weight_kg: document.getElementById('edit_weight_kg').value,
                skeletal_muscle: document.getElementById('edit_skeletal_muscle').value,
                body_fat: document.getElementById('edit_body_fat').value,
                fat_percentage: document.getElementById('edit_fat_percentage').value,
                basal_metabolism: document.getElementById('edit_basal_metabolism').value,
                bmi: document.getElementById('edit_bmi').value
            };
            const aliasPayload = {
                id: underScorePayload.record_id,
                date: underScorePayload.Date
            };
            const hyphenPayload = {
                'height-cm': underScorePayload.height_cm,
                'weight-kg': underScorePayload.weight_kg
            };

            const params = new URLSearchParams({
                ...underScorePayload,
                ...aliasPayload,
                ...hyphenPayload
            });

            const saveBtn = document.getElementById('saveEditBtn');
            try {
                saveBtn.disabled = true;
                saveBtn.innerText = '儲存中...';
                const res = await fetch('update_record.php', {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
                    body: params.toString()
                });
                const text = await res.text();
                let result;
                try { result = JSON.parse(text); } catch { throw new Error('後端未回傳 JSON：' + text); }

                if (result.success) {
                    showCustomAlert('更新成功');
                    window.editModalInstance?.hide();
                    await loadHistory();
                } else {
                    showCustomAlert('更新失敗：' + (result.error || '未知錯誤'), '錯誤');
                }
            } catch (err) {
                console.error(err);
                showCustomAlert('更新發生錯誤：' + err.message, '錯誤');
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerText = '儲存變更';
            }
        }

        // ✅ 等整個 DOM 都好了再做這兩件事：1) 呼叫 loadHistory；2) 綁定儲存按鈕
        document.addEventListener('DOMContentLoaded', () => {
            // 1) 真的把資料載進來，產生每張卡片上的「編輯/刪除」按鈕
            loadHistory();

            // 2) 這時候按鈕已在 DOM，才能穩定綁定事件
            const saveBtn = document.getElementById('saveEditBtn');
            if (saveBtn && !saveBtn.dataset.bound) {
                saveBtn.dataset.bound = '1';
                saveBtn.addEventListener('click', handleSaveEdit);
            }

            // 綁定日期篩選與重置
            const applyBtn = document.getElementById('btn_apply_filter');
            const resetBtn = document.getElementById('btn_reset_filter');
            const startEl = document.getElementById('filter_start');
            const endEl = document.getElementById('filter_end');
            if (applyBtn && !applyBtn.dataset.bound) {
                applyBtn.dataset.bound = '1';
                applyBtn.addEventListener('click', () => {
                    const start = document.getElementById('filter_start')?.value || '';
                    const end = document.getElementById('filter_end')?.value || '';
                    if (!start || !end) {
                        showCustomAlert('請先選擇「起始日期」與「結束日期」，再套用篩選', '提示！');
                        return;
                    }
                    applyDateFilter({ onlyOnApply: true, resetPage: true });
                });
            }
            if (resetBtn && !resetBtn.dataset.bound) {
                resetBtn.dataset.bound = '1';
                resetBtn.addEventListener('click', () => {
                    if (startEl) startEl.value = '';
                    if (endEl) endEl.value = '';
                    applyDateFilter({ onlyOnApply: true, resetPage: true });
                });
            }
            // 取消改變日期即時套用：需按下「套用篩選」才會生效

            // 初始化 Air Datepicker（繁體中文、yyyy-MM-dd）
            try {
                const zhTW = {
                    days: ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'],
                    daysShort: ['日','一','二','三','四','五','六'],
                    daysMin: ['日','一','二','三','四','五','六'],
                    months: ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'],
                    monthsShort: ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'],
                    today: '今天',
                    clear: '清除',
                    dateFormat: 'yyyy-MM-dd',
                    firstDay: 0
                };
                // 起始日曆
                if (startEl && !startEl.dataset.dpInit) {
                    startEl.dataset.dpInit = '1';
                    new AirDatepicker(startEl, {
                        locale: zhTW,
                        dateFormat: 'yyyy-MM-dd',
                        autoClose: true
                    });
                }
                // 結束日曆
                if (endEl && !endEl.dataset.dpInit) {
                    endEl.dataset.dpInit = '1';
                    new AirDatepicker(endEl, {
                        locale: zhTW,
                        dateFormat: 'yyyy-MM-dd',
                        autoClose: true
                    });
                }
            } catch (e) {
                console.warn('日期選擇器初始化失敗：', e);
            }
        });
    </script>
</body>

</html>

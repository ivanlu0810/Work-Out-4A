    <!-- 收藏頁面邏輯 -->
    <script>
        const API_FAVORITES = 'api/favorites.php';

        document.addEventListener("DOMContentLoaded", async function () {
            const list = document.getElementById("favorite-list");
            list.innerHTML = `<div class="loading-state"><p>載入中…</p></div>`;

            // 將舊的 localStorage 收藏遷移到資料庫（只做一次）
            try { await migrateLocalFavoritesOnce(); } catch (e) { }

            // 從後端載入收藏
            const serverFavorites = await fetchFavoritesFromServer();
            if (!serverFavorites || serverFavorites.length === 0) {
                list.innerHTML = `<div class="empty-state"><p>目前沒有收藏任何器材</p></div>`;
                // 清空快取
                localStorage.setItem("favorites", JSON.stringify([]));
                return;
            }

            // 同步快取
            localStorage.setItem("favorites", JSON.stringify(serverFavorites));
            renderFavorites(serverFavorites);
        });

        async function fetchFavoritesFromServer() {
            try {
                const res = await fetch(API_FAVORITES, { credentials: 'include' });
                if (!res.ok) throw new Error('無法載入收藏');
                const data = await res.json();
                return data.data || [];
            } catch (e) {
                console.error(e);
                return [];
            }
        }

        async function migrateLocalFavoritesOnce() {
            const migrated = localStorage.getItem('favorites_migrated');
            if (migrated === '1') return;
            const local = JSON.parse(localStorage.getItem('favorites') || '[]');
            if (!Array.isArray(local) || local.length === 0) { localStorage.setItem('favorites_migrated', '1'); return; }

            for (const exercise of local) {
                const name = exercise.name || '';
                if (!name) continue;
                try {
                    await fetch(API_FAVORITES, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({ name, exercise })
                    });
                } catch (e) { console.warn('上傳收藏失敗', name); }
            }
            localStorage.setItem('favorites_migrated', '1');
            // 舊資料可清空避免重複
            localStorage.setItem('favorites', JSON.stringify([]));
        }

        function renderFavorites(favorites) {
            const list = document.getElementById("favorite-list");
            if (!favorites?.length) {
                list.innerHTML = `<div class="empty-state"><p>目前沒有收藏任何器材</p></div>`;
                return;
            }

            let html = `<div class="accordion" id="favAccordion">`;
            favorites.forEach((ex, i) => {
                const id = `favItem${i}`;
                const hypertrophyWeightMin = Math.round(parseFloat(ex.hypertrophy_load_min_pct) || 0);
                const hypertrophyWeightMax = hypertrophyWeightMin + 15;
                const fatlossWeightMin = hypertrophyWeightMin - 20;
                const fatlossWeightMax = hypertrophyWeightMin - 5;

                html += `
      <div class="card">
        <div class="card-header" id="heading-${id}">
          <button class="btn btn-toggle" type="button" data-bs-toggle="collapse"
                  data-bs-target="#collapse-${id}" aria-expanded="false" aria-controls="collapse-${id}">
            <i class="bi bi-caret-right-fill"></i>
            <span>${ex.name || '未命名動作'}</span>
            <div class="acc-meta">
              <span class="badge-soft badge-muscle"><i class="bi bi-person-arms-up me-1"></i>${ex.target_muscle || '—'}</span>
              <span class="badge-soft badge-hyper">💪 增肌：${ex.hypertrophy_sets_min}-${ex.hypertrophy_sets_max} 組 / ${ex.hypertrophy_reps_min}-${ex.hypertrophy_reps_max} 次 / ${hypertrophyWeightMin}-${hypertrophyWeightMax}%</span>
              <span class="badge-soft badge-fat">🔥 減脂：${ex.fatloss_sets_min}-${ex.fatloss_sets_max} 組 / ${ex.fatloss_reps_min}-${ex.fatloss_reps_max} 次 / ${fatlossWeightMin}-${fatlossWeightMax}%</span>
            </div>
          </button>
        </div>

        <div id="collapse-${id}" class="collapse" aria-labelledby="heading-${id}" data-bs-parent="#favAccordion">
          <div class="acc-body">
            <div class="row g-4">
              <!-- 示範影片 -->
              <div class="col-12 col-md-6">
                <div class="ratio ratio-16x9">
                  <video controls playsinline preload="metadata">
                    <source src="${ex.video_url || ''}" type="video/mp4">
                    您的瀏覽器不支援影片播放。
                  </video>
                </div>
              </div>

              <!-- 指標與文字說明 -->
              <div class="col-12 col-md-6">
                <div class="acc-grid">
                  <div class="acc-stat"><strong>增肌 組數</strong><span>${ex.hypertrophy_sets_min}-${ex.hypertrophy_sets_max}</span></div>
                  <div class="acc-stat"><strong>增肌 次數</strong><span>${ex.hypertrophy_reps_min}-${ex.hypertrophy_reps_max}</span></div>
                  <div class="acc-stat"><strong>增肌 重量</strong><span>${hypertrophyWeightMin}-${hypertrophyWeightMax}%</span></div>
                  <div class="acc-stat"><strong>減脂 組數</strong><span>${ex.fatloss_sets_min}-${ex.fatloss_sets_max}</span></div>
                  <div class="acc-stat"><strong>減脂 次數</strong><span>${ex.fatloss_reps_min}-${ex.fatloss_reps_max}</span></div>
                  <div class="acc-stat"><strong>減脂 重量</strong><span>${fatlossWeightMin}-${fatlossWeightMax}%</span></div>
                </div>

                <!-- 動作解說 -->
                <div class="acc-section">
                  <h6>動作解說</h6>
                  <p>${ex.instruction_full || ex.description || '此動作暫無解說。'}</p>
                </div>

                <!-- 適用對象 -->
                <div class="acc-section">
                  <h6>適用對象</h6>
                  <p>${ex.user_level || '不限，請依照自身能力選擇是否執行。'}</p>
                </div>

                <!-- 注意事項 -->
                <div class="acc-section">
                  <h6>注意事項</h6>
                  <p>${ex.caution || '請保持正確姿勢，避免受傷。'}</p>
                </div>

                <div class="acc-actions">                  
                  <button class="btn btn-remove"
                          onclick="removeFavorite('${(ex.name || '').replace(/'/g, "\\'")}')">
                    <i class="bi bi-heartbreak me-1"></i>移除收藏
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>`;
            });

            html += `</div>`;
            list.innerHTML = html;

            // 展開時換箭頭
            list.querySelectorAll('.btn-toggle').forEach(btn => {
                const icon = btn.querySelector('.bi');
                const target = btn.getAttribute('data-bs-target');
                const el = document.querySelector(target);
                el?.addEventListener('show.bs.collapse', () => { icon.classList.replace('bi-caret-right-fill', 'bi-caret-down-fill'); });
                el?.addEventListener('hide.bs.collapse', () => { icon.classList.replace('bi-caret-down-fill', 'bi-caret-right-fill'); });
            });
        }

        // 移除收藏（改為呼叫 API）
        async function removeFavorite(name) {
            if (!confirm(`確定要移除收藏：${name}嗎？`)) return;
            try {
                await fetch(API_FAVORITES + '?name=' + encodeURIComponent(name), {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    credentials: 'include',
                    body: 'name=' + encodeURIComponent(name)
                });
                // 重新載入列表
                const serverFavorites = await fetchFavoritesFromServer();
                localStorage.setItem('favorites', JSON.stringify(serverFavorites));
                renderFavorites(serverFavorites);
            } catch (e) {
                alert('移除失敗，請稍後再試');
            }
        }

        // 詳細說明 Modal（跟 training.html 一致）
        function openExerciseModal(exercise, index) {
            const modalBody = document.getElementById("exerciseModalBody");

            modalBody.innerHTML = `
        <!-- 示範影片 -->
        <div class="mb-3">
          <h6 style="color:#2c3e50; font-weight:600; font-size:1rem;">示範影片：</h6>
          <div class="ratio ratio-16x9">
            <video id="exerciseVideo" controls playsinline preload="auto">
              <source src="${exercise.video_url || ''}" type="video/mp4">
              您的瀏覽器不支援影片播放。
            </video>
          </div>
        </div>

        <!-- 動作解說 -->
        <div class="mb-3">
          <h6 style="color:#2c3e50; font-weight:600; font-size:1rem;">動作解說：</h6>
          <p style="color:#6c757d; line-height:1.6;">
            ${exercise.instruction_full || exercise.description || "此動作暫無解說"}
          </p>
        </div>

        <!-- 適用對象 -->
        <div>
          <h6 style="color:#2c3e50; font-weight:600; font-size:1rem;">適用對象：</h6>
          <p style="color:#6c757d; line-height:1.6;">
            ${exercise.user_level || "不限，請依照自身能力選擇是否執行。"}
          </p>
        </div>
        
        <!-- 注意事項 -->
        <div class="mb-3">
          <h6 style="color:#2c3e50; font-weight:600; font-size:1rem;">注意事項：</h6>
          <p style="color:#6c757d; line-height:1.6;">
            ${exercise.caution || "請保持正確姿勢，避免受傷"}
          </p>
        </div>        
      `;

            // Modal 關閉時重置影片
            const modalEl = document.getElementById('exerciseModal');
            modalEl.addEventListener("hidden.bs.modal", () => {
                const v = document.getElementById("exerciseVideo");
                if (v) {
                    v.pause(); try { v.currentTime = 0; } catch (e) { }
                }
            }, { once: true });
        }
    </script>
</body>

</html>

    <script>
        // 營養計算功能
        document.getElementById('nutritionForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = {
                age: document.getElementById('age').value,
                gender: document.getElementById('gender').value,
                height: document.getElementById('height').value,
                weight: document.getElementById('weight').value,
                activity_level: document.getElementById('activityLevel').value,
                goal: document.getElementById('goal').value
            };
            
            try {
                // 計算 BMR
                const bmrResponse = await fetch('calculate_nutrition.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'calculate_bmr', ...formData })
                });
                const bmrResult = await bmrResponse.json();
                
                if (!bmrResult.success) throw new Error(bmrResult.error);
                
                // 計算 TDEE
                const tdeeResponse = await fetch('calculate_nutrition.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'calculate_tdee', bmr: bmrResult.bmr, activity_level: formData.activity_level })
                });
                const tdeeResult = await tdeeResponse.json();
                
                if (!tdeeResult.success) throw new Error(tdeeResult.error);
                
                // 計算營養目標
                const nutritionResponse = await fetch('calculate_nutrition.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'calculate_nutrition_goals', tdee: tdeeResult.tdee, goal: formData.goal })
                });
                const nutritionResult = await nutritionResponse.json();
                
                if (!nutritionResult.success) throw new Error(nutritionResult.error);
                
                // 顯示結果
                displayNutritionResults(nutritionResult);
                await loadMealSuggestions(nutritionResult);
                
            } catch (error) {
                alert('計算失敗: ' + error.message);
            }
        });
        
        function displayNutritionResults(result) {
            // 更新數值
            document.getElementById('targetCalories').textContent = result.target_calories;
            document.getElementById('proteinGrams').textContent = result.macros.protein.grams;
            document.getElementById('carbGrams').textContent = result.macros.carbs.grams;
            document.getElementById('fatGrams').textContent = result.macros.fat.grams;
            
            // 更新比例條
            document.getElementById('proteinBar').style.width = result.macros.protein.percentage + '%';
            document.getElementById('carbBar').style.width = result.macros.carbs.percentage + '%';
            document.getElementById('fatBar').style.width = result.macros.fat.percentage + '%';
            
            // 更新百分比和卡路里
            document.getElementById('proteinPercent').textContent = result.macros.protein.percentage + '%';
            document.getElementById('proteinCalories').textContent = result.macros.protein.calories + ' 卡路里';
            
            document.getElementById('carbPercent').textContent = result.macros.carbs.percentage + '%';
            document.getElementById('carbCalories').textContent = result.macros.carbs.calories + ' 卡路里';
            
            document.getElementById('fatPercent').textContent = result.macros.fat.percentage + '%';
            document.getElementById('fatCalories').textContent = result.macros.fat.calories + ' 卡路里';
            
            // 顯示結果區域
            document.getElementById('nutritionResult').style.display = 'block';
        }
        
        async function loadMealSuggestions(nutritionResult) {
            const mealTypes = ['breakfast', 'lunch', 'dinner', 'snack'];
            const mealNames = { breakfast: '早餐', lunch: '午餐', dinner: '晚餐', snack: '點心' };
            const mealCards = document.getElementById('mealCards');
            
            mealCards.innerHTML = '';
            
            for (const mealType of mealTypes) {
                try {
                    const response = await fetch('calculate_nutrition.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            action: 'get_meal_suggestions',
                            goal: nutritionResult.goal,
                            meal_type: mealType,
                            calories: nutritionResult.meal_distribution[mealType]
                        })
                    });
                    const result = await response.json();
                    
                    if (result.success) {
                        const mealCard = createMealCard(mealNames[mealType], result);
                        mealCards.appendChild(mealCard);
                    }
                } catch (error) {
                    console.error('載入餐食建議失敗:', error);
                }
            }
            
            document.getElementById('mealSuggestions').style.display = 'block';
        }
        
        function createMealCard(mealName, data) {
            const col = document.createElement('div');
            col.className = 'col-md-6 col-lg-3 mb-4';
            
            col.innerHTML = `
                <div class="card meal-card">
                    <div class="card-header">
                        <h6 class="mb-0">${mealName}</h6>
                        <small class="text-muted">目標: ${data.target_calories} 卡路里</small>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <h6>建議食物:</h6>
                            ${data.suggested_foods.slice(0, 3).map(food => `
                                <div class="food-item">
                                    <div class="d-flex justify-content-between">
                                        <span class="fw-bold">${food.name}</span>
                                        <span class="text-muted">${food.calories_per_100g}卡/100g</span>
                                    </div>
                                    <div class="mt-1">
                                        <span class="nutrition-badge">蛋白質 ${food.protein_per_100g}g</span>
                                        <span class="nutrition-badge">碳水 ${food.carbs_per_100g}g</span>
                                        <span class="nutrition-badge">脂肪 ${food.fat_per_100g}g</span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                        <div class="mt-3">
                            <h6>營養建議:</h6>
                            <ul class="list-unstyled">
                                ${data.tips.map(tip => `<li><i class="bi bi-check-circle text-success me-2"></i>${tip}</li>`).join('')}
                            </ul>
                        </div>
                    </div>
                </div>
            `;
            
            return col;
        }
    </script>
